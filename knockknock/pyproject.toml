[project]
name = "knockknock"
version = "0.1.0"
description = "Personalized job-application pipeline for Bangalore startups"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "tenacity>=8.5",
    "google-genai>=0.3",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-cloud-secret-manager>=2.20",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "playwright>=1.44",
    "selectolax>=0.3.21",
    "weasyprint>=62.3",
    "jinja2>=3.1",
    "typer>=0.12",
    "structlog>=24.2",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
telegram = [
    "python-telegram-bot>=21.3",
]

[project.scripts]
knockknock = "knockknock.__main__:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knockknock"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "ARG", "RUF"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["knockknock"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
