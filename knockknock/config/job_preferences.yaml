candidate:
  name: "Nishant Gupta"
  # Outbound signature address — used as ``From:`` on Gmail drafts (Phase 8).
  # Must match the Gmail account whose OAuth refresh token is configured.
  # NOTE: Gmail appends its own signature automatically; the Phase 8 prompt
  # therefore does NOT generate a sign-off block in the body.
  email: "ngofficial99@gmail.com"
  current_role: "Software Engineer at Zeotap"
  years_experience: 2
  location: "Bengaluru, India"
  # Optional one-line elevator pitch fed into the Pro draft prompt.
  pitch: "Backend engineer on Zeotap's Platform team — high-throughput, reactive distributed systems in Java (Vert.x) and Python (FastAPI) on GCP."

target:
  locations:
    - "Bengaluru"
    - "Bangalore"
    - "Remote (India)"
  # Token-boundary match (see filter/rules.py:_token_match). Single-word
  # tokens like "Backend" hit "Senior Backend Engineer", "Backend
  # Developer", etc., without matching substrings like "Engineering".
  # Narrowed to backend/platform/infra signals -- a job titled
  # "Backend Engineer" still matches via "Backend".
  titles_allow:
    - "Backend"
    - "Platform"
    - "Infrastructure"
    - "Distributed"
    - "SDE"
    - "SWE"
  titles_deny:
    - "Manager"
    - "Lead"
    - "Director"
    - "Intern"
    - "Frontend"
    - "Front-End"
    - "Mobile"
    - "iOS"
    - "Android"
    - "Designer"
    # Modelling / research roles -- not the skill set on the resume.
    - "Data Scientist"
    - "ML Researcher"
    - "Research Scientist"
  seniority_allow:
    - "Mid"
    - "Senior"
    - "SDE 2"
    - "SDE 3"
  # Errata E.2: SERIES_C_PLUS was split into SERIES_C and LATE_STAGE.
  company_size_allow:
    - "SEED"
    - "SERIES_A"
    - "SERIES_B"
    - "SERIES_C"
    - "LATE_STAGE"

skills:
  # Job description must mention >=1 of these to clear the pre-filter.
  # Dropped Node.js + TypeScript -- not on the resume. Kept Go as a
  # stretch language (Java/Go syntactic neighbours).
  must_have_any:
    - "Python"
    - "Java"
    - "Go"
  nice_to_have:
    - "Vert.x"
    - "FastAPI"
    - "Kafka"
    - "RabbitMQ"
    - "Kubernetes"
    - "GCP"
    - "AWS"
    - "Terraform"
    - "Postgres"
    - "Redis"
    - "BigQuery"

scoring:
  min_score_to_draft: 70
  weight_skill_match: 40
  weight_seniority_match: 25
  weight_location_match: 20
  weight_company_stage: 15

limits:
  daily_drafts_cap: 40
  hourly_discover_cap: 50
  gemini_pro_rpd_ceiling: 500

sources:
  hn:
    enabled: true
    months_lookback: 2
  wellfound:
    enabled: true
    query: "backend OR python OR java location:bangalore"
  yc_waas:
    enabled: true
    query: "backend bangalore"
  greenhouse:
    enabled: true
    boards: ["razorpay", "swiggy", "cred", "groww"]
  lever:
    enabled: true
    boards: ["postman", "atlan"]
  ashby:
    enabled: true
    boards: ["zerodha"]
