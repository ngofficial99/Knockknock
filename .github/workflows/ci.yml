name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    working-directory: knockknock

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.18"
          enable-cache: true

      - name: Pin Python
        run: uv python install 3.11

      - name: Install deps
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov=knockknock --cov-report=term-missing
